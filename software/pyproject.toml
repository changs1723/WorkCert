[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workcert"
version = "0.3.0"
description = "Reconstruction error metadata and reusable queries for tabulated structural responses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "Licence.txt"]
authors = [
  {name = "Saisai Hou"},
  {name = "Yunzhi Zhu"},
  {name = "Sen Zhang", email = "szhang@niit.edu.cn"},
]
dependencies = ["numpy>=1.24"]
keywords = ["force-displacement", "piecewise-linear", "compression", "work", "error-bound"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
workcert = "workcert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

