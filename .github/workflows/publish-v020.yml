name: publish-verified-v020
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v020.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  WORKCERT_TAG: v0.2.0
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v0.2.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify the immutable tag and its completed platform tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          expected = "5fd2cc0699aed522ba658d90d89d5dc66adef103"
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise RuntimeError("The immutable release tag does not match the verified source")
          base = "https://api.github.com/repos/changs1723/WorkCert/actions/runs/41623629749"
          def get(url):
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "User-Agent": "WorkCert-release-recovery",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run = get(base)
          jobs = get(base + "/jobs?per_page=100")["jobs"]
          tests = [job for job in jobs if job["name"].startswith("test (")]
          if (run["head_sha"] != expected or run["head_branch"] != "v0.2.0" or
                  len(tests) != 15 or any(job["conclusion"] != "success" for job in tests)):
              raise RuntimeError("All 15 tests of the exact tag must have passed")
          Path("PLATFORM_VALIDATION.json").write_text(json.dumps({
              "status": "PASS", "source_commit": expected, "platform_jobs_passed": 15,
              "run_url": run["html_url"], "original_run_conclusion": run["conclusion"],
              "publication_recovery_reason": "Hidden acceptance-log directory was excluded by the original artifact uploader",
              "jobs": [{"name": job["name"],
              "conclusion": job["conclusion"]} for job in tests]}, indent=2) + "\n")
          PY
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build --outdir software/dist software
      - name: Install and test the exact release distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          import tomllib
          import venv

          root = Path.cwd()
          metadata = tomllib.loads((root / "software/pyproject.toml").read_text())
          version = metadata["project"]["version"]
          if os.environ["WORKCERT_TAG"] != "v" + version:
              raise RuntimeError("The release tag does not match the package version")
          # release_validation.json describes the original 39-test historical runs.
          # Current counts come from the separately recorded acceptance phases.
          source_core_hash = hashlib.sha256(
              (root / "software/src/workcert/core.py").read_bytes()).hexdigest()
          candidates = {
              "wheel": list((root / "software/dist").glob("*.whl")),
              "sdist": list((root / "software/dist").glob("*.tar.gz"))}
          checks = []
          for kind, artifacts in candidates.items():
              if len(artifacts) != 1:
                  raise RuntimeError("Expected exactly one " + kind + " artifact")
              artifact = artifacts[0].resolve()
              environment = root / "release-checks" / kind
              venv.EnvBuilder(with_pip=True).create(environment)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
              probe_code = """import hashlib, importlib.metadata, json, pathlib, sys
          import numpy, workcert
          core = pathlib.Path(workcert.__file__).with_name('core.py')
          print(json.dumps({'version': importlib.metadata.version('workcert'),
                            'module': workcert.__file__, 'python': sys.version,
                            'numpy': numpy.__version__,
                            'core_sha256': hashlib.sha256(core.read_bytes()).hexdigest()}))
          """
              probe = json.loads(subprocess.check_output(
                  [str(python), "-c", probe_code], text=True))
              if probe["version"] != version or probe["core_sha256"] != source_core_hash:
                  raise RuntimeError("Installed artifact differs from the tagged source")
              if "site-packages" not in probe["module"]:
                  raise RuntimeError("Tests must import the installed distribution")
              evidence_dir = environment / "acceptance"
              subprocess.run([str(python), "validation/run_hou_acceptance.py",
                              "--phase", "all", "--output", str(evidence_dir)],
                             cwd=root, check=True)
              acceptance = json.loads((evidence_dir / "summary.json").read_text())
              if (acceptance["status"] != "PASS" or
                  acceptance["baseline"]["tests_run"] != 39 or
                  acceptance["independent"]["tests_run"] <= 0 or
                  acceptance["baseline"]["skipped"] or
                  acceptance["independent"]["skipped"]):
                  raise RuntimeError("Incomplete baseline or independent acceptance")
              cli = subprocess.check_output(
                  [str(python), "-m", "workcert", "--version"], text=True).strip()
              if version not in cli:
                  raise RuntimeError("Installed CLI has an unexpected version")
              checks.append({"artifact": artifact.name, "kind": kind,
                             "bytes": artifact.stat().st_size,
                             "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
                             "tests_passed": acceptance["tests_run"],
                             "baseline_tests_passed": acceptance["baseline"]["tests_run"],
                             "independent_tests_passed": acceptance["independent"]["tests_run"],
                             "acceptance_checks": acceptance["total_checks"],
                             "cli_version": cli, **probe})
          record = {"status": "PASS", "tag": os.environ["WORKCERT_TAG"],
                    "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "publication_workflow_commit": os.environ["GITHUB_SHA"],
                    "core_sha256": source_core_hash,
                    "validation": "Exact built wheel and sdist installed in separate fresh virtual environments",
                    "artifacts": checks}
          (root / "RELEASE_VALIDATION.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf8")
          PY
      - name: Preserve exact-distribution acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-distribution-acceptance
          path: release-checks/*/acceptance/
          if-no-files-found: error
      - name: Archive the complete scientific source
        run: |
          git archive --format=zip --output="WorkCert-${WORKCERT_TAG}-reproducibility.zip" HEAD
          sha256sum software/dist/* WorkCert-*-reproducibility.zip RELEASE_VALIDATION.json PLATFORM_VALIDATION.json > SHA256SUMS
      - name: Publish tagged assets after the platform matrix passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$WORKCERT_TAG" >/dev/null 2>&1; then
            echo "Release already exists; inspect its assets rather than overwriting it."
            exit 1
          else
            gh release create "$WORKCERT_TAG" --draft --verify-tag --title "WorkCert $WORKCERT_TAG" --notes-file RELEASE_NOTES.md software/dist/* WorkCert-*-reproducibility.zip RELEASE_VALIDATION.json PLATFORM_VALIDATION.json SHA256SUMS
            gh release edit "$WORKCERT_TAG" --draft=false
          fi
