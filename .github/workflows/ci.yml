name: package-tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the source package
        run: python -m pip install .
      - name: Check installed location
        run: python -c "import workcert; print(workcert.__version__, workcert.__file__)"
      - name: Run numerical, branch, persistence and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI version
        run: python -m workcert --version
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build --outdir software/dist software
      - name: Install and test the exact release distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          import tomllib
          import venv

          root = Path.cwd()
          metadata = tomllib.loads((root / "software/pyproject.toml").read_text())
          version = metadata["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != "v" + version:
              raise RuntimeError("The release tag does not match the package version")
          local = json.loads((root / "software/release_validation.json").read_text())
          expected_counts = {runtime[kind]["tests_passed"]
                             for runtime in local["runtimes"]
                             for kind in ("wheel", "sdist")}
          if expected_counts != {31}:
              raise RuntimeError("Update the frozen validation evidence for this release")
          source_core_hash = hashlib.sha256(
              (root / "software/src/workcert/core.py").read_bytes()).hexdigest()
          candidates = {
              "wheel": list((root / "software/dist").glob("*.whl")),
              "sdist": list((root / "software/dist").glob("*.tar.gz"))}
          checks = []
          for kind, artifacts in candidates.items():
              if len(artifacts) != 1:
                  raise RuntimeError("Expected exactly one " + kind + " artifact")
              artifact = artifacts[0].resolve()
              environment = root / ".release-checks" / kind
              venv.EnvBuilder(with_pip=True).create(environment)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
              probe_code = """import hashlib, importlib.metadata, json, pathlib, sys
          import numpy, workcert
          core = pathlib.Path(workcert.__file__).with_name('core.py')
          print(json.dumps({'version': importlib.metadata.version('workcert'),
                            'module': workcert.__file__, 'python': sys.version,
                            'numpy': numpy.__version__,
                            'core_sha256': hashlib.sha256(core.read_bytes()).hexdigest()}))
          """
              probe = json.loads(subprocess.check_output(
                  [str(python), "-c", probe_code], text=True))
              if probe["version"] != version or probe["core_sha256"] != source_core_hash:
                  raise RuntimeError("Installed artifact differs from the tagged source")
              if "site-packages" not in probe["module"]:
                  raise RuntimeError("Tests must import the installed distribution")
              test_code = """import sys, unittest
          suite = unittest.TestLoader().discover('software/tests')
          if suite.countTestCases() != 31:
              raise RuntimeError('Expected the frozen 31-test suite')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          """
              subprocess.run([str(python), "-c", test_code], cwd=root, check=True)
              cli = subprocess.check_output(
                  [str(python), "-m", "workcert", "--version"], text=True).strip()
              if version not in cli:
                  raise RuntimeError("Installed CLI has an unexpected version")
              checks.append({"artifact": artifact.name, "kind": kind,
                             "bytes": artifact.stat().st_size,
                             "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
                             "tests_passed": 31, "cli_version": cli, **probe})
          record = {"status": "PASS", "tag": os.environ["GITHUB_REF_NAME"],
                    "source_commit": os.environ["GITHUB_SHA"],
                    "core_sha256": source_core_hash,
                    "validation": "Exact built wheel and sdist installed in separate fresh virtual environments",
                    "artifacts": checks}
          (root / "RELEASE_VALIDATION.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf8")
          PY
      - name: Archive the complete scientific source
        run: |
          git archive --format=zip --output="WorkCert-${GITHUB_REF_NAME}-reproducibility.zip" HEAD
          sha256sum software/dist/* WorkCert-*-reproducibility.zip RELEASE_VALIDATION.json > SHA256SUMS
      - name: Publish tagged assets after the platform matrix passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; published assets were not replaced."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "WorkCert $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md software/dist/* WorkCert-*-reproducibility.zip RELEASE_VALIDATION.json SHA256SUMS
          fi
