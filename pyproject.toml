[build-system]
requires = ["setuptools>=50", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workcert"
version = "0.1.0"
description = "Certified piecewise-linear reduction and work queries for force-displacement responses"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "Saisai Hou"},
  {name = "Yunzhi Zhu"},
  {name = "Sen Zhang", email = "szhang@niit.edu.cn"},
]
dependencies = ["numpy>=1.24"]
keywords = ["force-displacement", "piecewise-linear", "compression", "work", "error-bound"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
workcert = "workcert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

